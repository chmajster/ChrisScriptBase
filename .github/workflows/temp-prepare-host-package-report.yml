name: Apply prepare-host package report

on:
  push:
    branches:
      - prepare-host-package-report

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare-host-package-report
          fetch-depth: 0
      - name: Apply changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Validate
        shell: bash
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck -e SC2155,SC2015 linux/install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners-legacy-service.sh
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/temp-prepare-host-package-report.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "List and verify prepare-host packages [package-report]"
          git push origin HEAD:prepare-host-package-report
