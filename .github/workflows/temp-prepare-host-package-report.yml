name: Apply prepare-host package report

on:
  push:
    branches:
      - prepare-host-package-report

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[package-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare-host-package-report
          fetch-depth: 0

      - name: Apply package verification changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('linux/install-github-selfhosted-runners.sh')
          text = script_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'APT_UPDATED=false\nPROFILES=()\n',
              '''APT_UPDATED=false
HOST_REQUIRED_PACKAGES=(
    ca-certificates
    curl
    jq
    git
    coreutils
    gawk
    sudo
    libc-bin
    findutils
    grep
    sed
    hostname
    docker.io
    dialog
)
PROFILES=()
''',
              'host package array',
          )

          replace_once(
              '''  --prepare-host            Przygotuj hosta i zakończ: zależności, Docker i dialog.
                            Przydatne do przygotowania obrazu/VM przed instalacją runnerów.
''',
              '''  --prepare-host            Przygotuj hosta i zakończ: zależności, Docker i dialog.
                            Instaluje brakujące pakiety, a następnie wyświetla ich
                            status i wersje oraz sprawdza działanie Docker Engine.
''',
              'prepare-host help',
          )

          anchor = '''apt_install(){
    (( $# > 0 )) || return 0
    apt_update_once
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$@"
}

'''
          addition = r'''package_installed(){
    local package="$1" status=""
    command -v dpkg-query >/dev/null 2>&1 || return 2
    status="$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)"
    [[ "$status" == "install ok installed" ]]
}

ensure_prepare_host_packages(){
    local package=""
    local -a missing=()
    [[ "$PREPARE_HOST" == true ]] || return 0
    command -v apt-get >/dev/null 2>&1 || return 0
    command -v dpkg-query >/dev/null 2>&1 || return 0

    for package in "${HOST_REQUIRED_PACKAGES[@]}"; do
        package_installed "$package" || missing+=("$package")
    done

    if (( ${#missing[@]} > 0 )); then
        log "Instalacja brakujących pakietów hosta: ${missing[*]}"
        apt_install "${missing[@]}"
    fi
}

host_package_report(){
    local package="" version="" docker_version=""
    local missing=0

    log "Weryfikacja pakietów hosta"
    printf '%-22s %-10s %s\n' "Pakiet" "Status" "Wersja"
    printf '%-22s %-10s %s\n' "----------------------" "----------" "------------------------------"

    if command -v dpkg-query >/dev/null 2>&1; then
        for package in "${HOST_REQUIRED_PACKAGES[@]}"; do
            if package_installed "$package"; then
                version="$(dpkg-query -W -f='${Version}' "$package" 2>/dev/null || true)"
                [[ -n "$version" ]] || version="n/d"
                printf '%-22s %-10s %s\n' "$package" "OK" "$version"
            else
                printf '%-22s %-10s %s\n' "$package" "BRAK" "-"
                ((missing += 1))
            fi
        done
    else
        warn "Brak dpkg-query: nie można odczytać wersji pakietów. Pokazuję wymaganą listę jako N/D."
        for package in "${HOST_REQUIRED_PACKAGES[@]}"; do
            printf '%-22s %-10s %s\n' "$package" "N/D" "-"
        done
    fi

    echo
    if docker info >/dev/null 2>&1; then
        docker_version="$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
        [[ -n "$docker_version" ]] || docker_version="n/d"
        printf 'Docker Engine: OK (wersja %s)\n' "$docker_version"
    else
        echo 'Docker Engine: BŁĄD'
        ((missing += 1))
    fi

    if (( missing > 0 )); then
        warn "Weryfikacja hosta wykryła $missing braków/błędów."
        return 1
    fi
    printf 'Wszystkie wymagane pakiety są zainstalowane (%d/%d).\n' "${#HOST_REQUIRED_PACKAGES[@]}" "${#HOST_REQUIRED_PACKAGES[@]}"
}

'''
          replace_once(anchor, anchor + addition, 'package helper functions')

          replace_once(
              '''    ensure_dependencies
    if [[ "$PREPARE_HOST" == true ]]; then
        docker_ready
        echo "Host przygotowany. Docker działa, a wymagane pakiety są zainstalowane."
        return 0
    fi
''',
              '''    ensure_dependencies
    if [[ "$PREPARE_HOST" == true ]]; then
        ensure_prepare_host_packages
        docker_ready
        host_package_report || die "Host nie przeszedł końcowej weryfikacji pakietów."
        echo "Host przygotowany. Docker działa, a wymagane pakiety są zainstalowane."
        return 0
    fi
''',
              'prepare-host main flow',
          )

          script_path.write_text(text)

          tests_path = Path('linux/tests/test-install-github-selfhosted-runners.sh')
          tests = tests_path.read_text()
          anchor_test = '''expect_success "apt metadata is refreshed at most once" bash -c '\n    source "$1"\n    APT_UPDATED=false\n    apt_calls=0\n    apt-get(){ ((apt_calls += 1)); return 0; }\n    apt_update_once\n    apt_update_once\n    [[ $apt_calls -eq 1 && $APT_UPDATED == true ]]\n' _ "$SCRIPT"\n\n'''
          new_tests = r'''expect_success "prepare-host required package list" bash -c '
    source "$1"
    packages=" ${HOST_REQUIRED_PACKAGES[*]} "
    for package in ca-certificates curl jq git coreutils gawk sudo libc-bin findutils grep sed hostname docker.io dialog; do
        [[ "$packages" == *" $package "* ]] || exit 1
    done
' _ "$SCRIPT"

expect_success "package report lists status and versions" bash -c '
    source "$1"
    HOST_REQUIRED_PACKAGES=(curl jq docker.io)
    dpkg-query(){
        local package="${@: -1}"
        if [[ "$*" == *"Status"* ]]; then
            printf "install ok installed"
        else
            printf "test-version-%s" "$package"
        fi
    }
    docker(){
        case "${1:-}" in
            info) return 0 ;;
            version) printf "99.0.0" ;;
        esac
    }
    output="$(host_package_report)"
    grep -Fq "curl" <<< "$output"
    grep -Fq "jq" <<< "$output"
    grep -Fq "docker.io" <<< "$output"
    grep -Fq "test-version-curl" <<< "$output"
    grep -Fq "Docker Engine: OK (wersja 99.0.0)" <<< "$output"
    grep -Fq "Wszystkie wymagane pakiety są zainstalowane (3/3)." <<< "$output"
' _ "$SCRIPT"

'''
          count = tests.count(anchor_test)
          if count != 1:
              raise SystemExit(f'test anchor: expected exactly one match, got {count}')
          tests = tests.replace(anchor_test, anchor_test + new_tests, 1)
          tests_path.write_text(tests)
          PY

      - name: Validate
        shell: bash
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck -e SC2155,SC2015 linux/install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners-legacy-service.sh

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/temp-prepare-host-package-report.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "List and verify prepare-host packages [package-report]"
          git push origin HEAD:prepare-host-package-report
