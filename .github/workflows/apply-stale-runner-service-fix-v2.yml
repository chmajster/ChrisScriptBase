name: Apply stale runner service cleanup fix v2

on:
  push:
    branches:
      - fix/remove-stale-runner-services-20260827
    paths:
      - '.github/workflows/apply-stale-runner-service-fix-v2.yml'
      - '.github/scripts/apply-stale-runner-service-fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-stale-runner-services-20260827
          fetch-depth: 0

      - name: Apply production fix
        run: python3 .github/scripts/apply-stale-runner-service-fix.py

      - name: Validate
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck linux/install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners-systemd.sh

      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linux/install-github-selfhosted-runners.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Remove stale GitHub runner systemd services'
            git push origin HEAD:fix/remove-stale-runner-services-20260827
          fi
