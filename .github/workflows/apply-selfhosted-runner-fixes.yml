name: Apply self-hosted runner fixes

on:
  push:
    branches:
      - test/selfhosted-runner-help-20260827
    paths:
      - '.github/workflows/apply-selfhosted-runner-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/selfhosted-runner-help-20260827
          fetch-depth: 0

      - name: Apply production fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('linux/install-github-selfhosted-runners.sh')
          text = path.read_text()

          replacements = [
              (
                  '    echo "GitHub owner:    $GITHUB_OWNER"\n    echo "Mode:            $MODE"',
                  '    echo "GitHub owner:    $GITHUB_OWNER"\n    echo "Owner source:    ${GITHUB_OWNER_SOURCE:-unknown}"\n    echo "Mode:            $MODE"',
              ),
              (
                  '    mapfile -t repositories < <(resolve_repositories)\n    [[ "$LIST_REPOS" == false ]] || return 0',
                  '    if [[ "$LIST_REPOS" == true ]]; then\n        resolve_repositories\n        return 0\n    fi\n\n    mapfile -t repositories < <(resolve_repositories)',
              ),
              (
                  '    rm -rf "$RUNNER_BASE"\n    id "$RUNNER_USER" &>/dev/null &&\n        userdel "$RUNNER_USER" 2>/dev/null || true',
                  '    rm -rf "$RUNNER_BASE"\n    if id "$RUNNER_USER" &>/dev/null; then\n        userdel "$RUNNER_USER" 2>/dev/null || true\n    fi',
              ),
              (
                  '    if [[ "$ACTION" == "install" ]]; then\n        create_runner_user\n    fi',
                  '    if [[ "$ACTION" == "install" && "$LIST_REPOS" == false ]]; then\n        create_runner_user\n    fi',
              ),
              (
                  '    if [[ "$ACTION" == "install" ]]; then\n        version="$(get_runner_version)"\n        arch="$(detect_arch)"\n    fi',
                  '    if [[ "$ACTION" == "install" && "$LIST_REPOS" == false ]]; then\n        version="$(get_runner_version)"\n        arch="$(detect_arch)"\n    fi',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate fixes
        shell: bash
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck linux/install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linux/install-github-selfhosted-runners.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Fix list-repos behavior and shell issues'
            git push origin HEAD:test/selfhosted-runner-help-20260827
          fi
