name: Apply stale runner service cleanup fix

on:
  push:
    branches:
      - fix/remove-stale-runner-services-20260827
    paths:
      - '.github/workflows/apply-stale-runner-service-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-stale-runner-services-20260827
          fetch-depth: 0

      - name: Apply production fix
        shell: bash
        env:
          PATCHER_B64: 
        run: |
          printf '%s' "$PATCHER_B64" | base64 --decode > /tmp/patch_runner.py
          python3 /tmp/patch_runner.py
          grep -Fq 'if cleanup_repo_runner_services "$repo"; then' linux/install-github-selfhosted-runners.sh
          grep -Fq 'cleanup_owner_repo_runner_services' linux/install-github-selfhosted-runners.sh

      - name: Validate
        shell: bash
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck linux/install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners-systemd.sh

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linux/install-github-selfhosted-runners.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Remove stale GitHub runner systemd services'
            git push origin HEAD:fix/remove-stale-runner-services-20260827
          fi
