name: Apply stale runner service cleanup fix

on:
  push:
    branches:
      - fix/remove-stale-runner-services-20260827
    paths:
      - '.github/workflows/apply-stale-runner-service-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-stale-runner-services-20260827
          fetch-depth: 0

      - name: Apply production fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('linux/install-github-selfhosted-runners.sh')
          text = path.read_text()

          old = 'RUNNER_BASE="${RUNNER_BASE:-/opt/github-runners}"\nDEFAULT_LABELS="${CUSTOM_LABELS:-homelab}"'
          new = 'RUNNER_BASE="${RUNNER_BASE:-/opt/github-runners}"\nRUNNER_SYSTEMD_DIR="${RUNNER_SYSTEMD_DIR:-/etc/systemd/system}"\nDEFAULT_LABELS="${CUSTOM_LABELS:-homelab}"'
          if text.count(old) != 1:
              raise SystemExit('RUNNER_BASE marker not found exactly once')
          text = text.replace(old, new, 1)

          marker = '\ninstall_repo_runner() {\n'
          helpers = r'''

list_runner_service_units() {
    {
        systemctl list-unit-files --type=service --no-legend --no-pager 'actions.runner.*.service' 2>/dev/null || true
        systemctl list-units --all --type=service --no-legend --no-pager 'actions.runner.*.service' 2>/dev/null || true
    } | awk '{print $1}' | awk '/^actions\.runner\..*\.service$/ && !seen[$0]++'
}

remove_runner_service_unit() {
    local unit="$1"
    log "Usuwanie usługi systemd: $unit"
    systemctl stop "$unit" >/dev/null 2>&1 || true
    systemctl disable "$unit" >/dev/null 2>&1 || true
    rm -f "${RUNNER_SYSTEMD_DIR}/${unit}"
    if [[ -d "$RUNNER_SYSTEMD_DIR" ]]; then
        find "$RUNNER_SYSTEMD_DIR" -type l -name "$unit" -delete 2>/dev/null || true
    fi
    systemctl reset-failed "$unit" >/dev/null 2>&1 || true
}

cleanup_repo_runner_services() {
    local repo="$1" unit lower prefix removed=0
    prefix="actions.runner.${GITHUB_OWNER}-${repo}."
    while IFS= read -r unit; do
        [[ -n "$unit" ]] || continue
        lower="${unit,,}"
        if [[ "$lower" == "${prefix,,}"*.service ]]; then
            remove_runner_service_unit "$unit"
            ((removed += 1))
        fi
    done < <(list_runner_service_units)
    if (( removed > 0 )); then
        systemctl daemon-reload >/dev/null 2>&1 || true
        echo "Usunięto usługi systemd dla ${GITHUB_OWNER}/${repo}: $removed"
        return 0
    fi
    return 1
}

cleanup_owner_repo_runner_services() {
    local unit lower prefix removed=0
    prefix="actions.runner.${GITHUB_OWNER}-"
    while IFS= read -r unit; do
        [[ -n "$unit" ]] || continue
        lower="${unit,,}"
        if [[ "$lower" == "${prefix,,}"*.service ]]; then
            remove_runner_service_unit "$unit"
            ((removed += 1))
        fi
    done < <(list_runner_service_units)
    if (( removed > 0 )); then
        systemctl daemon-reload >/dev/null 2>&1 || true
        echo "Usunięto wszystkie pozostałe repo-level usługi systemd ownera '$GITHUB_OWNER': $removed"
        return 0
    fi
    return 1
}

cleanup_org_runner_services() {
    local unit lower prefix removed=0
    prefix="actions.runner.${GITHUB_OWNER}."
    while IFS= read -r unit; do
        [[ -n "$unit" ]] || continue
        lower="${unit,,}"
        if [[ "$lower" == "${prefix,,}"*.service ]]; then
            remove_runner_service_unit "$unit"
            ((removed += 1))
        fi
    done < <(list_runner_service_units)
    if (( removed > 0 )); then
        systemctl daemon-reload >/dev/null 2>&1 || true
        echo "Usunięto pozostałe organization-level usługi systemd '$GITHUB_OWNER': $removed"
        return 0
    fi
    return 1
}
'''
          if text.count(marker) != 1:
              raise SystemExit('install_repo_runner marker not found exactly once')
          text = text.replace(marker, helpers + marker, 1)

          old = '''    log "[$ACTIVE_PROFILE] Usuwanie: ${GITHUB_OWNER}/${repo}"
    [[ -d "$dir" ]] || { echo "Runner lokalny nie istnieje: $dir"; return 3; }
    if [[ -x "$dir/svc.sh" ]]; then'''
          new = '''    log "[$ACTIVE_PROFILE] Usuwanie: ${GITHUB_OWNER}/${repo}"
    if [[ ! -d "$dir" ]]; then
        if cleanup_repo_runner_services "$repo"; then
            warn "Brak katalogu $dir; usunięto osierocone usługi systemd. Runner może nadal wymagać usunięcia z GitHub."
            return 0
        fi
        echo "Runner lokalny nie istnieje: $dir"
        return 3
    fi
    if [[ -x "$dir/svc.sh" ]]; then'''
          if text.count(old) != 1:
              raise SystemExit('uninstall_repo_runner entry marker not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    unset token; rm -rf "$dir"; [[ "$remote_ok" == true ]]
}

install_org_runner() {'''
          new = '''    cleanup_repo_runner_services "$repo" || true
    unset token
    rm -rf "$dir"
    [[ "$remote_ok" == true ]]
}

install_org_runner() {'''
          if text.count(old) != 1:
              raise SystemExit('uninstall_repo_runner exit marker not found exactly once')
          text = text.replace(old, new, 1)

          old = '''uninstall_org_runner() {
    local dir token="" remote_ok=true
    dir="$(org_runner_dir)"; [[ -d "$dir" ]] || { echo "Runner lokalny nie istnieje: $dir"; return 3; }
    if [[ -x "$dir/svc.sh" ]]; then'''
          new = '''uninstall_org_runner() {
    local dir token="" remote_ok=true
    dir="$(org_runner_dir)"
    if [[ ! -d "$dir" ]]; then
        if cleanup_org_runner_services; then
            warn "Brak katalogu $dir; usunięto osierocone organization-level usługi systemd."
            return 0
        fi
        echo "Runner lokalny nie istnieje: $dir"
        return 3
    fi
    if [[ -x "$dir/svc.sh" ]]; then'''
          if text.count(old) != 1:
              raise SystemExit('uninstall_org_runner entry marker not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    unset token; rm -rf "$dir"; [[ "$remote_ok" == true ]]
}

purge_if_empty() {'''
          new = '''    cleanup_org_runner_services || true
    unset token
    rm -rf "$dir"
    [[ "$remote_ok" == true ]]
}

purge_if_empty() {'''
          if text.count(old) != 1:
              raise SystemExit('uninstall_org_runner exit marker not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    mapfile -t repositories < <(resolve_repositories)
    [[ ${#repositories[@]} -gt 0 ]] || { warn "Profil '$ACTIVE_PROFILE': nic nie wybrano."; return 0; }
    echo "Wybrane repozytoria [$ACTIVE_PROFILE]: ${#repositories[@]}"'''
          new = '''    mapfile -t repositories < <(resolve_repositories)
    if [[ ${#repositories[@]} -eq 0 ]]; then
        if [[ "$ACTION" == uninstall && "$REPO_SELECTION_MODE" == all ]] && cleanup_owner_repo_runner_services; then
            warn "Profil '$ACTIVE_PROFILE': nie znaleziono katalogów runnerów, ale usunięto osierocone usługi systemd."
            return 0
        fi
        warn "Profil '$ACTIVE_PROFILE': nic nie wybrano."
        return 0
    fi
    echo "Wybrane repozytoria [$ACTIVE_PROFILE]: ${#repositories[@]}"'''
          if text.count(old) != 1:
              raise SystemExit('process_user_profile empty selection marker not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    done
    log "Podsumowanie profilu: $ACTIVE_PROFILE"
    echo "Akcja: $ACTION | Sukces: $success | Pominięte: $skipped | Błędy: $failed"'''
          new = '''    done
    if [[ "$ACTION" == uninstall && "$REPO_SELECTION_MODE" == all ]]; then
        cleanup_owner_repo_runner_services || true
    fi
    log "Podsumowanie profilu: $ACTIVE_PROFILE"
    echo "Akcja: $ACTION | Sukces: $success | Pominięte: $skipped | Błędy: $failed"'''
          if text.count(old) != 1:
              raise SystemExit('process_user_profile summary marker not found exactly once')
          text = text.replace(old, new, 1)

          old = '  --uninstall               Wyrejestrowuje i usuwa runnery.\n'
          new = '  --uninstall               Wyrejestrowuje runnery i usuwa ich usługi systemd.\n'
          if text.count(old) != 1:
              raise SystemExit('help uninstall marker not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate
        shell: bash
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck linux/install-github-selfhosted-runners.sh
          shellcheck linux/tests/test-install-github-selfhosted-runners.sh
          shellcheck linux/tests/test-install-github-selfhosted-runners-systemd.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners-systemd.sh

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linux/install-github-selfhosted-runners.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Remove stale GitHub runner systemd services'
            git push origin HEAD:fix/remove-stale-runner-services-20260827
          fi
