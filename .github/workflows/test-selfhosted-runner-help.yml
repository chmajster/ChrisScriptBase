name: Test self-hosted runner help

on:
  pull_request:
    paths:
      - 'linux/install-github-selfhosted-runners.sh'
      - 'linux/github-runner-docker/**'
      - 'linux/tests/test-install-github-selfhosted-runners.sh'
      - '.github/workflows/test-selfhosted-runner-help.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck \
            linux/install-github-selfhosted-runners.sh \
            linux/github-runner-docker/manager.sh \
            linux/github-runner-docker/entrypoint.sh
      - name: Run Docker runner regression tests
        run: bash linux/tests/test-install-github-selfhosted-runners.sh
