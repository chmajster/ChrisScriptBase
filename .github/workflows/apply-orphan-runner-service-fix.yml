name: Apply orphan runner service fix

on:
  push:
    branches:
      - fix/selfhosted-runner-orphan-services-20260827
    paths:
      - '.github/workflows/apply-orphan-runner-service-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/selfhosted-runner-orphan-services-20260827
          fetch-depth: 0

      - name: Apply production and regression fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          script_path = Path('linux/install-github-selfhosted-runners.sh')
          text = script_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  --uninstall               Wyrejestrowuje i usuwa runnery.',
              '  --uninstall               Wyrejestrowuje runnery i usuwa ich usługi systemd.',
              'help uninstall description',
          )

          old_local = r'''get_local_repositories() {
              local root dir meta repo
              root="$(profile_root)"
              [[ -d "$root" ]] || return 0
              for dir in "$root"/*; do
                  [[ -d "$dir" ]] || continue
                  [[ "$(basename "$dir")" == "organization" ]] && continue
                  [[ -f "$dir/.runner" || -f "$dir/.chrisscriptbase-runner" ]] || continue
                  repo=""
                  meta="$dir/.chrisscriptbase-runner"
                  [[ -f "$meta" ]] && repo="$(awk -F= '$1=="repo" {sub(/^repo=/,""); print; exit}' "$meta")"
                  [[ -n "$repo" ]] || repo="$(basename "$dir")"
                  printf '%s\n' "$repo"
              done
          }'''.replace('              ', '    ')

          new_local = r'''list_action_runner_service_units() {
              {
                  systemctl list-units --all --type=service --no-legend 'actions.runner.*.service' 2>/dev/null |
                      awk '{print $1}' || true
                  systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null |
                      awk '{print $1}' || true
              } | awk '/^actions\.runner\..*\.service$/ && !seen[$0]++'
          }

          repo_from_service_unit() {
              local unit="$1" prefix rest host marker repo runner repo_sanitized profile_sanitized
              unit="${unit,,}"
              prefix="actions.runner.${GITHUB_OWNER,,}-"
              [[ "$unit" == "$prefix"*".service" ]] || return 1

              rest="${unit#"$prefix"}"
              rest="${rest%.service}"
              host="$(hostname -s)"
              host="${host,,}"
              marker=".${host}-"
              [[ "$rest" == *"$marker"* ]] || return 1

              repo="${rest%%"$marker"*}"
              runner="${rest#*"$marker"}"
              [[ -n "$repo" && -n "$runner" ]] || return 1

              repo_sanitized="$(sanitize_name "$repo")"
              if [[ "$ACTIVE_PROFILE" == "default" ]]; then
                  [[ "$runner" == "$repo_sanitized" ]] || return 1
              else
                  profile_sanitized="$(sanitize_name "$ACTIVE_PROFILE")"
                  [[ "$runner" == "${profile_sanitized}-${repo_sanitized}" || "$runner" == "$repo_sanitized" ]] || return 1
              fi

              printf '%s\n' "$repo"
          }

          runner_service_units_for_repo() {
              local repo="$1" unit parsed
              while IFS= read -r unit; do
                  [[ -n "$unit" ]] || continue
                  parsed="$(repo_from_service_unit "$unit")" || continue
                  if [[ "${parsed,,}" == "${repo,,}" ]]; then
                      printf '%s\n' "$unit"
                  fi
              done < <(list_action_runner_service_units)
          }

          get_service_repositories() {
              local unit repo
              while IFS= read -r unit; do
                  [[ -n "$unit" ]] || continue
                  repo="$(repo_from_service_unit "$unit")" || continue
                  printf '%s\n' "$repo"
              done < <(list_action_runner_service_units) |
                  awk 'NF && !seen[tolower($0)]++'
          }

          scan_runner_root_repositories() {
              local root="$1" dir meta repo runner_url
              [[ -d "$root" ]] || return 0

              for dir in "$root"/*; do
                  [[ -d "$dir" ]] || continue
                  case "$(basename "$dir")" in
                      organization|profiles) continue ;;
                  esac
                  [[ -f "$dir/.runner" || -f "$dir/.chrisscriptbase-runner" ]] || continue

                  repo=""
                  meta="$dir/.chrisscriptbase-runner"
                  if [[ -f "$meta" ]]; then
                      repo="$(awk -F= '$1=="repo" {sub(/^repo=/,""); print; exit}' "$meta")"
                  fi

                  if [[ -z "$repo" && -f "$dir/.runner" ]]; then
                      runner_url="$(jq -r '.gitHubUrl // empty' "$dir/.runner" 2>/dev/null || true)"
                      runner_url="${runner_url%/}"
                      if [[ "${runner_url,,}" == "https://github.com/${GITHUB_OWNER,,}/"* ]]; then
                          repo="${runner_url##*/}"
                      fi
                  fi

                  [[ -n "$repo" ]] || repo="$(basename "$dir")"
                  printf '%s\n' "$repo"
              done
          }

          get_local_repositories() {
              local root
              root="$(profile_root)"
              {
                  scan_runner_root_repositories "$root"
                  if [[ "$ACTIVE_PROFILE" != "default" ]]; then
                      scan_runner_root_repositories "$RUNNER_BASE"
                  fi
                  get_service_repositories
              } | awk 'NF && !seen[tolower($0)]++'
          }'''.replace('          ', '')

          replace_once(old_local, new_local, 'local repository/service discovery')

          old_uninstall = r'''uninstall_repo_runner() {
              local repo="$1" dir token="" remote_ok=true
              dir="$(repo_runner_dir "$repo")"
              log "[$ACTIVE_PROFILE] Usuwanie: ${GITHUB_OWNER}/${repo}"
              [[ -d "$dir" ]] || { echo "Runner lokalny nie istnieje: $dir"; return 3; }
              if [[ -x "$dir/svc.sh" ]]; then
                  (
                      cd "$dir"
                      ./svc.sh stop || true
                      ./svc.sh uninstall || true
                  )
              fi
              if [[ -f "$dir/.runner" && -x "$dir/config.sh" ]]; then
                  if token="$(get_repo_remove_token "$repo")" && [[ -n "$token" && "$token" != null ]]; then
                      sudo -u "$RUNNER_USER" bash -c "cd '$dir' && ./config.sh remove --unattended --token '$token'" || remote_ok=false
                  else
                      warn "Brak remove token; usuwam tylko lokalnie."; remote_ok=false
                  fi
              fi
              unset token; rm -rf "$dir"; [[ "$remote_ok" == true ]]
          }'''.replace('              ', '    ')

          new_uninstall = r'''find_repo_runner_dirs() {
              local repo="$1" current legacy dir
              current="$(repo_runner_dir "$repo")"
              legacy="${RUNNER_BASE}/$(sanitize_name "$repo")"

              for dir in "$current" "$legacy"; do
                  [[ -d "$dir" ]] || continue
                  printf '%s\n' "$dir"
              done | awk '!seen[$0]++'
          }

          service_name_from_runner_dir() {
              local dir="$1"
              [[ -f "$dir/.service" ]] || return 0
              head -n 1 "$dir/.service" | tr -d '\r'
          }

          remove_runner_service_unit() {
              local unit="$1" fragment=""
              case "$unit" in
                  actions.runner.*.service) ;;
                  *) warn "Pomijam nieoczekiwaną nazwę usługi: $unit"; return 1 ;;
              esac

              systemctl stop "$unit" >/dev/null 2>&1 || true
              systemctl disable "$unit" >/dev/null 2>&1 || true
              fragment="$(systemctl show --property=FragmentPath --value "$unit" 2>/dev/null || true)"

              if [[ "$fragment" == /etc/systemd/system/actions.runner.*.service ]]; then
                  rm -f -- "$fragment"
              fi
              rm -f -- "/etc/systemd/system/$unit"
              find /etc/systemd/system -type l -name "$unit" -delete 2>/dev/null || true

              systemctl daemon-reload >/dev/null 2>&1 || true
              systemctl reset-failed "$unit" >/dev/null 2>&1 || true
              return 0
          }

          uninstall_repo_runner() {
              local repo="$1" dir token="" service_unit="" remote_ok=true local_ok=true
              local -a dirs=() units=() remaining=()

              log "[$ACTIVE_PROFILE] Usuwanie: ${GITHUB_OWNER}/${repo}"
              mapfile -t dirs < <(find_repo_runner_dirs "$repo")
              mapfile -t units < <(runner_service_units_for_repo "$repo")

              if [[ ${#dirs[@]} -eq 0 && ${#units[@]} -eq 0 ]]; then
                  echo "Runner lokalny ani usługa systemd nie istnieją dla: ${GITHUB_OWNER}/${repo}"
                  return 3
              fi

              for dir in "${dirs[@]}"; do
                  service_unit="$(service_name_from_runner_dir "$dir")"

                  if [[ -x "$dir/svc.sh" ]]; then
                      if ! (
                          cd "$dir"
                          ./svc.sh stop
                          ./svc.sh uninstall
                      ); then
                          warn "svc.sh nie usunął poprawnie usługi z $dir; wykonuję wymuszone czyszczenie systemd."
                      fi
                  fi

                  if [[ -n "$service_unit" ]]; then
                      remove_runner_service_unit "$service_unit" || local_ok=false
                  fi

                  if [[ -f "$dir/.runner" && -x "$dir/config.sh" ]]; then
                      token=""
                      if token="$(get_repo_remove_token "$repo")" && [[ -n "$token" && "$token" != null ]]; then
                          sudo -u "$RUNNER_USER" bash -c "cd '$dir' && ./config.sh remove --unattended --token '$token'" || remote_ok=false
                      else
                          warn "Brak remove token; usuwam runnera i usługę tylko lokalnie."
                          remote_ok=false
                      fi
                      unset token
                  fi

                  rm -rf "$dir"
              done

              mapfile -t units < <(runner_service_units_for_repo "$repo")
              for service_unit in "${units[@]}"; do
                  remove_runner_service_unit "$service_unit" || local_ok=false
              done

              mapfile -t remaining < <(runner_service_units_for_repo "$repo")
              if [[ ${#remaining[@]} -gt 0 ]]; then
                  warn "Nie udało się usunąć usług systemd dla ${GITHUB_OWNER}/${repo}: ${remaining[*]}"
                  local_ok=false
              fi

              [[ "$remote_ok" == true && "$local_ok" == true ]]
          }'''.replace('          ', '')

          replace_once(old_uninstall, new_uninstall, 'repository uninstall')

          old_purge = r'''purge_if_empty() {
              [[ "$PURGE" == true ]] || return 0
              if [[ -d "$RUNNER_BASE" ]] && find "$RUNNER_BASE" -mindepth 1 -type f \
                \( -name .runner -o -name .chrisscriptbase-runner \) -print -quit | grep -q .; then
                  warn "--purge: w $RUNNER_BASE nadal istnieją runnery."; return 0
              fi
              rm -rf "$RUNNER_BASE"
              if id "$RUNNER_USER" &>/dev/null; then
                  userdel "$RUNNER_USER" 2>/dev/null || true
              fi
              echo "Purge zakończony."
          }'''.replace('              ', '    ')

          new_purge = r'''purge_if_empty() {
              local -a remaining_services=()
              [[ "$PURGE" == true ]] || return 0
              if [[ -d "$RUNNER_BASE" ]] && find "$RUNNER_BASE" -mindepth 1 -type f \
                \( -name .runner -o -name .chrisscriptbase-runner \) -print -quit | grep -q .; then
                  warn "--purge: w $RUNNER_BASE nadal istnieją runnery."
                  return 0
              fi

              mapfile -t remaining_services < <(list_action_runner_service_units)
              if [[ ${#remaining_services[@]} -gt 0 ]]; then
                  warn "--purge: nadal istnieją usługi GitHub Actions Runner; nie usuwam użytkownika $RUNNER_USER."
                  printf ' - %s\n' "${remaining_services[@]}" >&2
                  return 0
              fi

              rm -rf "$RUNNER_BASE"
              if id "$RUNNER_USER" &>/dev/null; then
                  userdel "$RUNNER_USER" 2>/dev/null || true
              fi
              echo "Purge zakończony."
          }'''.replace('          ', '')

          replace_once(old_purge, new_purge, 'purge guard')
          script_path.write_text(text)

          test_path = Path('linux/tests/test-install-github-selfhosted-runners.sh')
          tests = test_path.read_text()
          marker = "printf '\\nRESULT: pass=%d fail=%d\\n' \"$pass\" \"$fail\"\n"
          if marker not in tests:
              raise SystemExit('test insertion marker not found')

          regression = r'''
          expect_success "legacy service is discovered for named profile" env LIB="$LIB" TEST_TMP="$TMP" bash -c '
              source "$LIB"
              ACTIVE_PROFILE=home
              GITHUB_OWNER=chmajster
              hostname() { echo kynlab01; }
              systemctl() {
                  if [[ "$1" == list-units ]]; then
                      printf "%s\n" "actions.runner.chmajster-HomeLAB-DNS.kynlab01-homelab-dns.service loaded active running"
                  fi
                  return 0
              }
              [[ $(get_service_repositories) == homelab-dns ]]
          '

          expect_success "orphan legacy service is removed without runner directory" env LIB="$LIB" TEST_TMP="$TMP" bash -c '
              source "$LIB"
              ACTIVE_PROFILE=home
              GITHUB_OWNER=chmajster
              RUNNER_BASE="$TEST_TMP/runners"
              hostname() { echo kynlab01; }
              list_action_runner_service_units() {
                  [[ -f "$TEST_TMP/service-removed" ]] || echo actions.runner.chmajster-HomeLAB-DNS.kynlab01-homelab-dns.service
              }
              remove_runner_service_unit() {
                  echo "$1" > "$TEST_TMP/service-removed"
                  return 0
              }
              uninstall_repo_runner HomeLAB-DNS
              grep -Fqx actions.runner.chmajster-HomeLAB-DNS.kynlab01-homelab-dns.service "$TEST_TMP/service-removed"
          '

          expect_success "svc uninstall failure falls back to forced service cleanup" env LIB="$LIB" TEST_TMP="$TMP" bash -c '
              source "$LIB"
              ACTIVE_PROFILE=home
              GITHUB_OWNER=chmajster
              RUNNER_BASE="$TEST_TMP/runners-fallback"
              dir="$RUNNER_BASE/profiles/home/homelab-dns"
              mkdir -p "$dir"
              printf "%s\n" actions.runner.chmajster-HomeLAB-DNS.kynlab01-home-homelab-dns.service > "$dir/.service"
              printf "#!/usr/bin/env bash\nexit 1\n" > "$dir/svc.sh"
              chmod +x "$dir/svc.sh"
              list_action_runner_service_units() { return 0; }
              remove_runner_service_unit() { echo "$1" > "$TEST_TMP/forced-service"; return 0; }
              uninstall_repo_runner HomeLAB-DNS
              [[ ! -d "$dir" ]]
              grep -Fqx actions.runner.chmajster-HomeLAB-DNS.kynlab01-home-homelab-dns.service "$TEST_TMP/forced-service"
          '

          expect_success "purge keeps runner user when services still exist" env LIB="$LIB" TEST_TMP="$TMP" bash -c '
              source "$LIB"
              PURGE=true
              RUNNER_BASE="$TEST_TMP/purge-root"
              RUNNER_USER=github-runner
              mkdir -p "$RUNNER_BASE"
              list_action_runner_service_units() { echo actions.runner.chmajster-Repo.host-repo.service; }
              id() { echo "id should not be called" > "$TEST_TMP/id-called"; return 0; }
              purge_if_empty
              [[ -d "$RUNNER_BASE" && ! -e "$TEST_TMP/id-called" ]]
          '

          '''.replace('          ', '')

          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Validate
        shell: bash
        run: |
          bash -n linux/install-github-selfhosted-runners.sh
          shellcheck linux/install-github-selfhosted-runners.sh
          bash linux/tests/test-install-github-selfhosted-runners.sh

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linux/install-github-selfhosted-runners.sh linux/tests/test-install-github-selfhosted-runners.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Remove orphan GitHub runner systemd services'
            git push origin HEAD:fix/selfhosted-runner-orphan-services-20260827
          fi
